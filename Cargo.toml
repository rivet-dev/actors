[profile.dev]
overflow-checks = false
# "line-tables-only" produces just the line-number DWARF needed for stack
# traces, skipping variable/type info. Meaningfully faster debug builds
# (~2 min per engine cross-compile) with no runtime cost.
debug = "line-tables-only"
lto = "off"

[profile.dev.build-override]
opt-level = 3

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
opt-level = 3

# Release-grade optimization with DWARF line info and no symbol stripping so
# heaptrack can resolve native allocation backtraces during leak investigation.
# Uses thin LTO and more codegen units to keep frames un-inlined and builds fast.
[profile.profiling]
inherits = "release"
debug = 1
lto = "thin"
codegen-units = 16
strip = false

[profile.quick]
inherits = "dev"
debug = false          # no debug info → faster link, smaller binary
strip = "symbols"      # strip what's left
opt-level = 1          # cheap optimizations, still fast to compile
panic = "abort"        # drops unwinding tables
codegen-units = 256    # max parallelism
